# Roles are resolved against this list in order; unavailable providers are
# skipped (no API key, or circuit breaker open), so the app degrades instead of
# failing. Prices are EUR per million tokens and are inputs, not truths.
providers:
  mistral:
    base_url: https://api.mistral.ai
    api_key_env: MISTRAL_API_KEY
  openai:
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
  ollama:
    base_url: http://ollama:11434

models:
  gen-mistral:
    provider: mistral
    model: mistral-small-latest
    in_eur: 0.20
    out_eur: 0.60
  gen-openai:
    provider: openai
    model: gpt-4.1-mini
    in_eur: 0.40
    out_eur: 1.60
  judge:
    provider: openai
    model: gpt-4o-mini
    in_eur: 0.15
    out_eur: 0.60
  judge-mistral:
    provider: mistral
    model: mistral-small-latest
    in_eur: 0.20
    out_eur: 0.60
  local-qwen:
    provider: ollama
    model: qwen2.5:3b-instruct
    in_eur: 0
    out_eur: 0

routes:
  explain: [gen-mistral, gen-openai, local-qwen]
  tutor: [gen-mistral, gen-openai, local-qwen]
  judge: [judge, judge-mistral]

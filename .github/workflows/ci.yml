name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: retrieval gate + provider drift
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (default: this commit)"
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: api / lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ccse
          POSTGRES_PASSWORD: ccse
          POSTGRES_DB: ccse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccse -d ccse"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CCSE_DATABASE_URL: postgresql+asyncpg://ccse:ccse@localhost:5432/ccse
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Migrations + integration tests
        run: |
          uv run alembic upgrade head
          uv run pytest -m integration

  web:
    name: web / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: compose / model validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env
        run: cp .env.example .env
      - name: Dev model
        run: docker compose -f infra/compose.yml -f infra/compose.dev.yml --env-file .env config >/dev/null
      - name: Prod model
        run: docker compose -f infra/compose.yml -f infra/compose.prod.yml --env-file .env config >/dev/null

  eval:
    name: eval / retrieval gate
    # Too slow for every PR (downloads the manual and an embedding model), but
    # it is the gate that matters: run it weekly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ccse
          POSTGRES_PASSWORD: ccse
          POSTGRES_DB: ccse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccse -d ccse"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CCSE_DATABASE_URL: postgresql+asyncpg://ccse:ccse@localhost:5432/ccse
      MANUAL_URL: https://cervantes.org/sites/public/produccion/files/2026-10/manual-preparacion-prueba-ccse-2026.pdf
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-multilingual-minilm-v1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Ingest the manual
        run: |
          curl -sSL -o /tmp/manual.pdf "$MANUAL_URL"
          uv run python -m app.jobs.ingest /tmp/manual.pdf
      - run: uv run python -m app.jobs.embed
      - run: uv run python -m app.jobs.precompute
      - name: Retrieval gate (recall@5 >= 0.85 on the leak-free query mode)
        run: uv run python -m app.evals.run --min-recall 0.85

  build:
    name: images / build and push
    needs: [api, web, compose]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: mode=max
          sbom: true
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: web
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: mode=max
          sbom: true

  scan:
    name: images / trivy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: deploy / production
    needs: scan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Lets the Actions UI redeploy or roll back to an existing image tag.
      TAG: ${{ github.event.inputs.tag || github.sha }}
      # Secret if you want it redacted in logs, repo/environment variable if
      # you don't mind it being visible. Falls back to 22.
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT" 2>/dev/null; then
            echo "::error::TCP ${DEPLOY_HOST}:${DEPLOY_PORT} is not reachable from this runner."
            echo "The app ports are up (443), so this is SSH-specific: wrong port,"
            echo "a firewall allowing only your IP, or SSH bound to another address."
            exit 1
          fi

          if ! ssh-keyscan -p "$DEPLOY_PORT" -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null \
             || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan produced no host keys for ${DEPLOY_HOST}:${DEPLOY_PORT}"
            exit 1
          fi
      - name: Sync compose files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e "ssh -p ${DEPLOY_PORT} -o BatchMode=yes" infra/ \
            "${{ secrets.DEPLOY_USER }}@${DEPLOY_HOST}:${{ vars.DEPLOY_PATH }}/infra/"
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -p "${DEPLOY_PORT}" -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${DEPLOY_HOST}" \
            "cd ${{ vars.DEPLOY_PATH }} && TAG=${{ env.TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} ./infra/deploy.sh"
